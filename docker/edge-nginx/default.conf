# ============================================================
# EDGE NGINX
# Public Reverse Proxy / Load Balancer
# ============================================================

upstream laravel_backend {
    # Primary Docker application
    server 127.0.0.1:8000 max_conns=100;

    # Backup application server
    server 192.168.1.113:80 backup;

    # Reuse upstream connections
    keepalive 32;
}


# ============================================================
# HTTP → HTTPS
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name dolebelison.com;

    return 301 https://$host$request_uri;
}


# ============================================================
# HTTPS EDGE SERVER
# ============================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dolebelison.com;

    # --------------------------------------------------------
    # TLS
    # --------------------------------------------------------

    ssl_certificate     /etc/nginx/ssl/dolebelison.com.crt;
    ssl_certificate_key /etc/nginx/ssl/dolebelison.com.key;

    ssl_session_timeout 10m;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_prefer_server_ciphers off;

    # --------------------------------------------------------
    # Security headers
    # --------------------------------------------------------

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Strict-Transport-Security \
        "max-age=31536000; includeSubDomains" always;

    # Upgrade insecure requests
    add_header Content-Security-Policy \
        "upgrade-insecure-requests" always;

    # --------------------------------------------------------
    # Proxy
    # --------------------------------------------------------

    location / {

        proxy_pass http://laravel_backend;

        # Preserve original request information
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;

        # WebSocket / connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ----------------------------------------------------
        # Timeouts
        # ----------------------------------------------------

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # ----------------------------------------------------
        # Buffering
        # ----------------------------------------------------

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    # --------------------------------------------------------
    # Static edge files
    # --------------------------------------------------------

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------
    # Deny hidden files
    # --------------------------------------------------------

    location ~ /\.(?!well-known).* {
        deny all;
    }
}