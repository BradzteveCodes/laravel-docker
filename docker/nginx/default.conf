server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ---------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------
    # Laravel
    # ---------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---------------------------------------------------------
    # Common static files
    # ---------------------------------------------------------

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # ---------------------------------------------------------
    # PHP-FPM
    # ---------------------------------------------------------

    location ~ \.php$ {
        # Only execute real PHP files
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass app:9000;

        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Prevent proxy header injection
        fastcgi_param HTTP_PROXY "";

        # Pass the original request information
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        # Hide PHP version disclosure
        fastcgi_hide_header X-Powered-By;
    }

    # ---------------------------------------------------------
    # Deny hidden files
    # ---------------------------------------------------------

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ---------------------------------------------------------
    # Deny sensitive application files
    # ---------------------------------------------------------

    location ~* ^/(?:\.env|composer\.(?:json|lock)|package(?:-lock)?\.json|artisan|phpunit\.xml|vite\.config\..*)$ {
        deny all;
    }

    # ---------------------------------------------------------
    # Static asset caching
    # ---------------------------------------------------------

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";

        access_log off;

        try_files $uri =404;
    }
}