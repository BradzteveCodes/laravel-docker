[www]

; ------------------------------------------------------------
; Process identity
; ------------------------------------------------------------

user = www-data
group = www-data

; ------------------------------------------------------------
; Listening
; ------------------------------------------------------------

listen = 9000
listen.backlog = 511

listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ------------------------------------------------------------
; Process manager
; ------------------------------------------------------------

pm = dynamic

pm.max_children = 30
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; ------------------------------------------------------------
; Process limits
; ------------------------------------------------------------

pm.max_requests = 500

; ------------------------------------------------------------
; Status / ping
; ------------------------------------------------------------

pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; ------------------------------------------------------------
; Logging
; ------------------------------------------------------------

access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r\" %s"

slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

request_terminate_timeout = 120s

; ------------------------------------------------------------
; Environment
; ------------------------------------------------------------

clear_env = no