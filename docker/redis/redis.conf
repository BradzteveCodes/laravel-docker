# ============================================================
# Redis Production Configuration
# ============================================================

# ------------------------------------------------------------
# Network
# ------------------------------------------------------------

# Redis will listen on all interfaces inside the container.
bind 0.0.0.0

# Redis should NOT be exposed publicly by the host.
protected-mode no

port 6379

# ------------------------------------------------------------
# Connections
# ------------------------------------------------------------

tcp-backlog 511
timeout 0
tcp-keepalive 300

# ------------------------------------------------------------
# Memory
# ------------------------------------------------------------

# Set this according to the production server's available RAM.
maxmemory 512mb

# Evict least-recently-used keys when memory is full.
maxmemory-policy allkeys-lru

# ------------------------------------------------------------
# Persistence
# ------------------------------------------------------------

# RDB snapshots
save 900 1
save 300 10
save 60 10000

# Store AOF for better durability.
appendonly yes
appendfsync everysec

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

loglevel notice
logfile ""

# ------------------------------------------------------------
# Security
# ------------------------------------------------------------

# Do not leave Redis unauthenticated if the container could
# ever be reachable outside the private Docker network.
#
# Inject the password through deployment/secret management.
# Example:
#
# requirepass YOUR_REDIS_PASSWORD

# ------------------------------------------------------------
# Databases
# ------------------------------------------------------------

databases 16

# ------------------------------------------------------------
# Performance
# ------------------------------------------------------------

hz 10
dynamic-hz yes