[program:reverb]

process_name=%(program_name)s

command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080

directory=/var/www/html

autostart=true
autorestart=true

stopasgroup=true
killasgroup=true

user=www-data

redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stopwaitsecs=10